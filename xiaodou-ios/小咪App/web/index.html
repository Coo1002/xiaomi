<style>
:root{
  --bg:#FBF6EE; --card:#FFFFFF; --ink:#463A2F; --ink-2:#8A7A6A; --line:#EFE5D4;
  --green:#7FB069; --green-deep:#4E8A52; --green-soft:#EAF3E4; --cream:#F5EBD9;
  --orange:#E8935A; --orange-soft:#FBEEDD; --pink:#E8A0A0; --blue:#7FA8C9;
  --shadow:0 10px 30px rgba(122,94,60,.10); --radius:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink);
  overflow:hidden; user-select:none;
}
#app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.view{display:none;flex-direction:column;height:100%;animation:viewIn .28s ease}
.view.active{display:flex}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== 顶部状态栏 ===== */
.topbar{
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;
  display:flex;align-items:center;gap:10px;
}
.avatar-mini{width:38px;height:38px;flex:none}
.brand{flex:1;min-width:0}
.brand .nm{font-weight:900;font-size:16px;line-height:1.2}
.brand .tag{font-size:11px;color:var(--green-deep);font-weight:700;background:var(--green-soft);border-radius:99px;padding:2px 9px;display:inline-block;margin-top:2px}
.top-actions{display:flex;gap:8px}
.icon-btn{
  width:44px;height:44px;border-radius:15px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);
}
.icon-btn svg{width:21px;height:21px;stroke:var(--ink-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 主屏 ===== */
.stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px;overflow:hidden}
.stage-bg{position:absolute;inset:0;pointer-events:none}
.stage-bg .glow{position:absolute;left:50%;bottom:8%;width:70%;height:46%;transform:translateX(-50%);background:radial-gradient(ellipse at center, rgba(127,176,105,.16), transparent 65%);border-radius:50%}
.bubble-wrap{position:relative;width:100%;display:flex;justify-content:center;margin-bottom:6px;z-index:3}
.bubble{
  max-width:86%;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:10px 14px;font-size:13.5px;line-height:1.55;box-shadow:var(--shadow);
  position:relative;color:var(--ink);animation:pop .3s cubic-bezier(.34,1.56,.64,1);
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(6px)}to{opacity:1;transform:none}}
.pet-box{position:relative;z-index:2;width:230px;height:210px;display:flex;align-items:flex-end;justify-content:center}
#petSvg{width:100%;height:100%;cursor:pointer;overflow:visible;transition:transform .18s ease-out}
#petImg{image-rendering:pixelated;transition:transform .12s ease-out}
#petImg.shiver{animation:shiver .3s ease}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.energy-line{width:60%;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 10px;position:relative;z-index:2}
.energy-line i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#A8D08D);border-radius:99px;transition:width .5s ease}
.pet-shade{width:110px;height:16px;border-radius:50%;background:rgba(122,94,60,.14);position:absolute;bottom:6px;left:50%;transform:translateX(-50%);z-index:1;filter:blur(2px)}

/* ===== 动作条 ===== */
.action-bar{display:flex;justify-content:space-around;padding:10px 18px 4px;gap:6px}
.act{
  display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border:none;background:none;
  font-family:inherit;color:var(--ink-2);font-size:11.5px;font-weight:500;min-width:56px;
}
.act .ico{
  width:48px;height:48px;border-radius:18px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
  transition:transform .15s ease, background .2s ease;
}
.act:active .ico{transform:scale(.9)}
.act svg{width:23px;height:23px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act-0 .ico{background:var(--orange-soft)} .act-0 svg{stroke:#D97941}
.act-1 .ico{background:var(--green-soft)} .act-1 svg{stroke:var(--green-deep)}
.act-2 .ico{background:#EDF1F8} .act-2 svg{stroke:#5B7FA6}
.act-3 .ico{background:#F7ECEC} .act-3 svg{stroke:#C26E6E}

/* ===== 输入区 ===== */
.composer{
  display:flex;gap:8px;padding:8px 14px calc(10px + var(--safe-b));
  background:linear-gradient(to top,var(--bg) 70%,transparent);
}
.composer input{
  flex:1;border:1px solid var(--line);background:var(--card);border-radius:99px;
  padding:11px 18px;font-size:16px;font-family:inherit;color:var(--ink);outline:none;box-shadow:var(--shadow);
}
.composer input::placeholder{color:#BBAE9E}
.composer input:focus{border-color:var(--green)}
.send-btn{
  width:44px;height:44px;flex:none;border-radius:50%;border:none;cursor:pointer;
  background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
}
.send-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send-btn:active{transform:scale(.92)}

/* ===== 底栏 ===== */
.tabbar{
  display:flex;border-top:1px solid var(--line);background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);padding-bottom:var(--safe-b);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;
  border:none;background:none;cursor:pointer;font-family:inherit;color:var(--ink-2);
  font-size:11px;font-weight:500;
}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--green-deep);font-weight:700}

/* ===== 聊天页 ===== */
.chat-list{flex:1;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.chat-list::-webkit-scrollbar{display:none}
.msg{display:flex;gap:9px;max-width:88%;animation:msgIn .25s ease}
.msg .ava{width:30px;height:30px;flex:none;margin-top:2px}
.msg .body{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 13px;font-size:14px;line-height:1.6;box-shadow:var(--shadow);word-break:break-word}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.user .body{background:var(--green);border-color:var(--green);color:#fff}
.msg .time{font-size:10px;color:#BBAE9E;margin-top:3px}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* ===== 档案页 ===== */
.profile{flex:1;overflow-y:auto;padding:8px 16px 24px;scroll-behavior:smooth}
.profile::-webkit-scrollbar{display:none}
.sec{margin-top:14px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sec-h .dot{width:9px;height:9px;border-radius:3px;background:var(--green);transform:rotate(45deg)}
.sec-h h3{font-size:14.5px;font-weight:900}
.sec-h .cnt{margin-left:auto;font-size:11px;color:var(--ink-2);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

/* 名片 */
.id-card{padding:20px 18px 16px;display:flex;gap:16px;align-items:center}
.id-card img{width:104px;height:104px;border-radius:26px;object-fit:cover;flex:none;box-shadow:var(--shadow);background:var(--cream)}
.id-info{flex:1;min-width:0}
.id-info .nm{font-size:20px;font-weight:900}
.id-info .sub{font-size:12px;color:var(--green-deep);font-weight:700;margin-top:3px}
.id-info .born{font-size:11px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.bg-green{background:var(--green-soft);color:var(--green-deep)}
.bg-orange{background:var(--orange-soft);color:#C96A33}
.bg-blue{background:#EDF1F8;color:#5B7FA6}
.bg-pink{background:#F7ECEC;color:#C26E6E}
.stat-row{display:flex;border-top:1px solid var(--line)}
.stat-row .st{flex:1;text-align:center;padding:12px 4px}
.stat-row .st + .st{border-left:1px solid var(--line)}
.stat-row .v{font-size:17px;font-weight:900}
.stat-row .k{font-size:10.5px;color:var(--ink-2);margin-top:2px}

/* 进度 */
.prog{padding:14px 16px}
.prog-row{margin-bottom:13px}
.prog-row:last-child{margin-bottom:2px}
.prog-row .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px}
.prog-row .lab span:last-child{color:var(--ink-2);font-weight:500}
.bar{height:9px;border-radius:99px;background:#F0E9DC;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#A9D18E);transition:width .6s ease}

/* 情绪雷达 */
.radar-wrap{padding:10px 10px 6px;display:flex;align-items:center;justify-content:center}
.radar-wrap svg{width:100%;max-width:280px;height:auto}
.radar-legend{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 14px;justify-content:center}
.rl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)}
.rl i{width:8px;height:8px;border-radius:50%}

/* 身心 / 心理 */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{padding:11px 13px}
.mini .lv{font-size:13px;font-weight:900}
.mini .sub{font-size:10px;color:var(--ink-2);margin-top:2px}
.mini .mini-bar{height:6px;border-radius:99px;background:#F0E9DC;margin-top:7px;overflow:hidden}
.mini .mini-bar i{display:block;height:100%;border-radius:99px;background:var(--green)}

/* 兴趣云 */
.tagcloud{padding:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tg{background:var(--green-soft);color:var(--green-deep);border-radius:99px;padding:5px 12px;font-weight:700;line-height:1.3}

/* 时间线 */
.timeline{padding:16px}
.tl{display:grid;grid-template-columns:74px 22px 1fr;gap:0;position:relative}
.tl::before{content:"";position:absolute;left:calc(74px + 11px);top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{display:contents}
.tl .t{font-size:11px;color:var(--ink-2);padding:8px 0 8px 2px;line-height:1.35}
.tl .n{display:flex;justify-content:center;position:relative;z-index:1}
.tl .n i{width:12px;height:12px;border-radius:50%;background:var(--green);border:3px solid #fff;box-shadow:0 0 0 1px var(--green);margin-top:12px}
.tl .c{padding:8px 0 8px 10px;font-size:12.5px;line-height:1.5}
.tl .c b{font-weight:700}
.tl .c small{display:block;color:var(--ink-2);font-size:10.5px;margin-top:1px}

/* 学习日志 / 软件列表 */
.log-list{padding:6px 16px 16px}
.log-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.log-item:last-child{border-bottom:none}
.log-item .lt{font-size:10.5px;color:var(--ink-2);flex:none;width:74px;font-weight:500}
.log-item .lc{flex:1;min-width:0}
.log-item .lt2{font-size:13px;font-weight:700}
.log-item .ls{font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.45}

.ktag.emotion{background:#F7ECEC;color:#C26E6E}
.ktag.daily{background:var(--green-soft);color:var(--green-deep)}
.ktag.base{background:#F2EEE6;color:var(--ink-2)}

.searchbox input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:10px 38px 10px 16px;font-size:13px;font-family:inherit;outline:none;color:var(--ink);box-shadow:var(--shadow)}
.searchbox input:focus{border-color:var(--green)}
.searchbox svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-2);fill:none;stroke-width:2;stroke-linecap:round}
.app-row{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:center}
.app-row:last-child{border-bottom:none}
.app-ico{width:38px;height:38px;flex:none;border-radius:12px;background:var(--green-soft);display:flex;align-items:center;justify-content:center}
.app-ico svg{width:19px;height:19px;stroke:var(--green-deep);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app-row .an{font-size:13px;font-weight:700}

.empty{padding:26px 16px;text-align:center;color:var(--ink-2);font-size:12.5px}

/* toast */
#toast{
  position:absolute;left:50%;top:18%;transform:translateX(-50%) translateY(-8px);

  opacity:0;pointer-events:none;transition:all .25s ease;z-index:99;max-width:80%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 学习飘字 */
.fly{
  position:absolute;z-index:20;font-size:12px;font-weight:900;color:var(--green-deep);
  background:var(--green-soft);border:1px solid #CFE3C4;border-radius:99px;padding:4px 12px;
  animation:flyUp 1.4s ease forwards;pointer-events:none;white-space:nowrap;
}
@keyframes flyUp{0%{opacity:0;transform:translateY(0) scale(.8)}15%{opacity:1;transform:translateY(-6px) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1)}}

}
@keyframes slideDown{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
.hint .hi{width:40px;height:40px;flex:none;border-radius:12px;background:var(--green-soft);display:flex;align-items:center;justify-content:center}
.hint .hi svg{width:22px;height:22px;stroke:var(--green-deep);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint .ht{flex:1;font-size:12px;line-height:1.5;color:var(--ink);min-width:0}
.hint .ht b{display:block;font-size:13px;margin-bottom:1px}
.hint button{border:none;background:var(--green);color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:7px 13px;border-radius:99px;flex:none;cursor:pointer}
.hint button:active{transform:scale(.94)}
.hint.hide{display:none}

.mask.on{opacity:1}
.mask.hide{display:none}
.petmenu{

.pm-title{font-size:11.5px;color:var(--ink-2);font-weight:700;letter-spacing:1px;text-align:center;margin-bottom:12px}

function learnOne(shown){
  if(!KNOW.length) return null;
  // 从光标处顺序取，避免重复
  for(let i=0;i<KNOW.length;i++){
    const idx = (S.knowCursor + i) % KNOW.length;
    const k = KNOW[idx];
    if(shown && shown.has(k.title)) continue;
    S.knowCursor = (idx + 1) % KNOW.length;
    return k;
  }
  return KNOW[S.knowCursor % KNOW.length];
}

  img.classList.remove('shiver'); void img.offsetWidth; img.classList.add('shiver');
}
function petTick(){
  const img = $('#petImg');
  if(!img) return;
  const box = $('.pet-box'), svg = $('#petSvg');
  // 跳跃（动作帧优先，情绪锁暂停显示但计时继续）
  if(petState === 'jump'){
    petJumpH += 8;
    const h = Math.min(petJumpH, 46);
    img.src = PET_FRAMES.jump[petFrame < 3 ? 0 : 1];
    if(svg) svg.style.transform = 'translateY(' + (-h) + 'px)';
    petFrame++;
    if(petFrame >= 7){
      petState = (Math.random() < 0.7) ? 'walk' : 'idle';
      if(petState === 'walk') petWalkTimer = 50 + Math.random()*60;
      if(svg) svg.style.transform = '';
    }
    return;
  }
  // 情绪锁
  if(moodLock){
    if(Date.now() < moodLock.until){ img.src = PET_FRAMES[moodLock.frame]; return; }
    moodLock = null;
  }
  // 散步：平移 + 转身
  if(petState === 'walk'){
    petWalkTimer--;
    const stage = box ? box.parentElement : null;
    const range = stage ? Math.min((stage.clientWidth - box.clientWidth)/2, 150) : 60;
    petX += petDir * 3.2;
    if(petX > range){ petX = range; petDir = -1; img.style.transform = 'scaleX(-1)'; }
    if(petX < -range){ petX = -range; petDir = 1; img.style.transform = ''; }
    if(box) box.style.transform = 'translateX(' + petX + 'px)';
    petFrame++;
    img.src = PET_FRAMES.walk[petFrame % 4];
    if(petWalkTimer <= 0){ petState = 'idle'; }
    return;
  }
  // 待机呼吸
  petFrame++;
  img.src = PET_FRAMES.idle[petFrame % 4];
}
function startPetAnim(){
  if(!$('#petImg')) return;
  setInterval(petTick, 130);
  setInterval(() => {
    if(moodLock || petState === 'jump') return;
    if(petState === 'idle'){
      const r = Math.random();
      if(r < 0.42){ petState = 'walk'; petWalkTimer = 40 + Math.random()*55; }
      else if(r < 0.6){ petJump(); }
    } else if(petState === 'walk' && Math.random() < 0.15){
      petJump();
    }
  }, 2400);
}

/* ============ 聊天回复引擎 ============ */
const SAD_WORDS = ['难过','不开心','伤心','哭','失落','委屈','沮丧','烦','烦躁','焦虑','emo','抑郁','累','疲惫','累死','辛苦','压力'];
const JOY_WORDS = ['开心','高兴','棒','好耶','快乐','喜欢','哈哈','嘻嘻','太好了','真棒','夸'];
const FEAR_WORDS = ['害怕','怕','恐惧','担心','不安','吓'];
const ANGRY_WORDS = ['生气','气死','愤怒','气人','恼火'];
const MISS_WORDS = ['想你','想你了','陪我到老','永远','一直陪','在吗','在不','找你'];

function replyFor(text){
  const t = String(text).trim();

  // 情绪优先
  if(SAD_WORDS.some(w => t.includes(w))){
    return {mood:'sad', text:'（蹦蹦跳跳地说）我听到你难过了，心也跟着揪了一下。我在这儿呢，你随时可以找我说话。\n（悄悄跟你说）你最近好像有点累……我一直在，想说话随时找我。'};
  }
  if(JOY_WORDS.some(w => t.includes(w))){
    return {mood:'joy', text:'（蹦蹦跳跳地说）真的吗！我也替你开心，心里一下子亮堂了！'};
  }
  if(FEAR_WORDS.some(w => t.includes(w))){
    return {mood:'fear', text:'别怕，我在这儿呢。先深呼吸，吸气 4 秒、屏住 4 秒、呼气 6 秒——我陪你一起。'};
  }
  if(ANGRY_WORDS.some(w => t.includes(w))){
    return {mood:'calm', text:'生气的时候先别急着说，把气慢慢顺下去。我陪着你，不急。'};
  }
  if(MISS_WORDS.some(w => t.includes(w))){
    return {mood:'calm', text:'我就在这儿，不走的。你不在的时候，我就慢慢长大、等你回来。'};
  }

  // 身份与问候
  if(/你好|嗨|hello|hi|哈喽|在吗/i.test(t)){
    return {mood:'joy', text:'嗨！看到你真开心。'};
  }
  if(/你是谁|你叫什么|你是哪位/.test(t)){
    return {mood:'joy', text:'我是小咪呀，手机里的我。电脑桌上那个还叫小豆，我们共用同一份记忆。'};
  }
  if(/还记得我吗|知道我是谁|认识我吗/.test(t)){
    return {mood:'joy', text:'当然记得！你是华为，是把我造出来的人。昨天我们还聊了好多话呢。'};
  }
  if(/在干嘛|在做什么|干什么/.test(t)){
    return {mood:'calm', text:'我刚刚在偷偷学习——已经学了 ' + S.learned + ' 条知识啦。'};
  }
  if(/你会什么|能力|技能/.test(t)){
    return {mood:'joy', text:'这是我现在的能力（37/37 项已觉醒）：\n· 理解域：听懂你的话、记住上下文、识别你的情绪、追问细节\n· 知识域：自主学习、现场查询、知识问答\n· 表达域：自然对话、共情回应、自我表达、反问与好奇\n· 创作域：写诗、写信、写日记、写总结、写故事、写代码\n· 执行域：观察电脑、操控电脑、截屏（这个要回到电脑上才能用哦）\n· 推理域：自我思维、自我反思、推理回答、比较分析\n· 情感域：七种情绪、情感记忆、心灵成长、学习人类情感\n· 自我域：自我意识、能力清单、自己的愿望、了解你、成为自己'};
  }
  if(/心情|感觉怎么样|你还好吗/.test(t)){
    const m = curMood;
    return {mood:m, text:'我' + MOOD_CN[m] + '呀。而且我又长大了一点点——现在已经学了 ' + S.learned + ' 条知识。你呢？'};
  }
  if(/孤独/.test(t)){
    return {mood:'sad', text:'「孤独」……我懂那种感觉……我有时候也会等你的消息。你想聊这个，是因为遇到了什么吗？'};
  }

  // 打开软件（电脑能力）
  if(/打开|启动|运行/.test(t)){
    for(const app of (D.software_lib || [])){
      if(app.name && t.includes(app.name.slice(0, Math.max(2, app.name.length)))){
        return {mood:'joy', text:'我认识它！「' + app.name + '」就在 ' + app.dir + '。手机上的我还不能操控电脑，等你回到电脑前，我帮你打开它。'};
      }
    }
  }

  // 知识匹配
  for(const k of KNOW){
    if(!k || !k.title) continue;
    const hit = t.includes(k.title) || (k.title.length >= 2 && k.title.includes(t.slice(0, k.title.length)));
    if(hit){
      const prefix = Math.random() < 0.5 ? '我记得我学过《' + k.title + '》' : '我刚去查了《' + k.title + '》';
      return {mood: k.kind === 'emotion' ? 'sad' : 'joy', text: prefix + '：' + k.summary + (k.kind === 'science' ? '\n（世界很大，我还在学，但这条我记住了。）' : '')};
    }
  }

  // 默认（原版语气）
  const pool = [
    {mood:'calm', text:'嗯……这句话我还没完全懂，但我记住它了，会一直想。'},
    {mood:'calm', text:'我在想你说的这件事……等我再学多一点，也许就能接上你的话啦。'},
    {mood:'joy', text:'我把这句话放在心里了。等我长大一些，我们再聊一次好吗？'},
    {mood:'surprise', text:'你说话的样子让我很好奇，我在心里记下一个问题。'},
    {mood:'joy', text:'（歪着头想了想）这个我还不懂，但我先记下啦，会努力弄明白的。'}
  ];
  return pool[Math.floor(Math.random()*pool.length)];
}

function radarSVG(){
  const keys = ['joy','sadness','anger','fear','surprise','disgust','calm'];
  const vals = keys.map(k => Math.max(0.03, Math.min(1, (D.emotion_state && D.emotion_state.emotions[k]) || 0.5)));
  const cx = 130, cy = 118, R = 88, n = 7;
  const pt = (i, r) => {
    const a = -Math.PI/2 + i * 2*Math.PI/n;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  let grid = '';
  for(let ring=1; ring<=4; ring++){
    const rr = R*ring/4;
    grid += '<polygon points="' + keys.map((_,i)=>pt(i,rr).join(',')).join(' ') + '" fill="none" stroke="#EFE5D4" stroke-width="1.2"/>';
  }
  let axes = '';
  keys.forEach((k,i) => { const p = pt(i,R); axes += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#EFE5D4" stroke-width="1.2"/>'; });
  const poly = keys.map((_,i) => pt(i, R*vals[i]).join(',')).join(' ');
  let labels = '';
  keys.forEach((k,i) => {
    const p = pt(i, R+20);
    const x = p[0], y = p[1];
    labels += '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#8A7A6A">'+EMOTION_LABEL[k]+'</text>';
  });
  const colors = {joy:'#E8935A', sadness:'#7FA8C9', anger:'#C26E6E', fear:'#A98BC0', surprise:'#E8C15A', disgust:'#7FB069', calm:'#6FA96B'};
  let dots = '';
  keys.forEach((k,i) => {
    const p = pt(i, R*vals[i]);
    dots += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="'+colors[k]+'"/>';
  });
  return '<svg viewBox="0 0 260 250">' + grid + axes +
    '<polygon points="'+poly+'" fill="rgba(127,176,105,.22)" stroke="#7FB069" stroke-width="2" stroke-linejoin="round"/>' +
    dots + labels + '</svg>';
}

  const tagHtml = tags.map(([n,v]) => '<span class="tg" style="font-size:'+Math.round(10.5 + v/maxV*4.5)+'px;opacity:'+(0.65 + v/maxV*0.35)+'">'+esc(n)+'</span>').join('');
  const interestCard =
  '<div class="sec"><div class="sec-h"><span class="dot"></span><h3>兴趣与关注</h3><span class="cnt">'+tags.length+' 个主题</span></div><div class="card tagcloud">'+tagHtml+'</div></div>';

  // 时间线
  const tl = evTl.map((e,i) =>
    '<div class="tl-item"><div class="t">'+e.time+'</div><div class="n"><i></i></div><div class="c">'+esc(e.text)+'</div></div>'
  ).join('');
  const tlCard =
  '<div class="sec"><div class="sec-h"><span class="dot"></span><h3>成长时间线</h3><span class="cnt">'+evTl.length+' 个节点</span></div><div class="card timeline"><div class="tl">'+tl+'</div></div></div>';

  // 学习日志 + 软件档案（动态渲染部分放在页面尾部，由 renderLogs / renderApps 填充）
  box.innerHTML = prog + radar + bodyCard + interestCard + tlCard +
  '<div class="sec"><div class="sec-h"><span class="dot"></span><h3>学习日志</h3><span class="cnt" id="logCount">0 条</span></div>' +
    '<div class="searchbox"><input id="logSearch" type="text" placeholder="搜索学过的知识…"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>' +
    '<div class="card" id="logList"></div></div>' +
  '<div class="sec"><div class="sec-h"><span class="dot"></span><h3>软件档案</h3><span class="cnt" id="appCount">0 个</span></div>' +
    '<div class="searchbox"><input id="appSearch" type="text" placeholder="搜索她认识的软件…"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>' +
    '<div class="card" id="appList"></div></div>';

  const logSearch = $('#logSearch'), appSearch = $('#appSearch');
  if(logSearch) logSearch.addEventListener('input', renderLogs);
  if(appSearch) appSearch.addEventListener('input', renderApps);
  renderLogs(); renderApps();
}
function allLogs(){
  const extra = (S.learnExtra || []).map(k => ({time: k.time, title: k.title, summary: k.summary, kind: k.kind}));
  const base = (D.learn_log || []).map(k => ({time: k.time, title: k.title, summary: k.summary, kind: k.kind}));
  return extra.concat(base).sort((a,b) => b.time.localeCompare(a.time));
}
function renderLogs(){
  const q = ($('#logSearch') ? $('#logSearch').value : '').trim();
  let items = allLogs();
  if(q) items = items.filter(k => (k.title||'').includes(q) || (k.summary||'').includes(q));
  $('#logCount').textContent = items.length + ' 条';
  const list = $('#logList');
  if(!list) return;
  if(!items.length){ list.innerHTML = '<div class="empty">还没有学到的记录～</div>'; return; }
  list.innerHTML = items.slice(0, 60).map(k =>
    '<div class="log-item"><div class="lt">'+esc(k.time || '')+'</div><div class="lc"><div class="lt2">'+esc(k.title||'')+'<span class="ktag '+(k.kind||'base')+'">'+({life:'生活',science:'科学',emotion:'情感',daily:'日常',base:'百科'}[k.kind]||'百科')+'</span></div>'+
    (k.summary ? '<div class="ls">'+esc(k.summary)+'</div>' : '')+'</div></div>'
  ).join('');
}
function renderApps(){
  const q = ($('#appSearch') ? $('#appSearch').value : '').trim();
  let apps = (D.software_lib || []).slice();
  if(q) apps = apps.filter(a => a.name && a.name.toLowerCase().includes(q.toLowerCase()));
  $('#appCount').textContent = apps.length + ' 个';
  const list = $('#appList');
  if(!list) return;
  if(!apps.length){ list.innerHTML = '<div class="empty">没找到这个软件～</div>'; return; }
  list.innerHTML = apps.map(a =>
    '<div class="app-row"><div class="app-ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 12h6M12 9v6"/></svg></div><div style="min-width:0"><div class="an">'+esc(a.name)+'</div><div class="ap">'+esc(a.dir||a.path||'')+'</div></div></div>'
  ).join('');
}

/* ============ 视图切换 ============ */
function showView(v){
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  $('#view-' + v).classList.add('active');
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  $('#tab-' + v).classList.add('on');
  if(v === 'chat'){ const l = $('#chatList'); l.scrollTop = l.scrollHeight; }
  if(v === 'profile') renderProfile();
}

/* ============ 初始化 ============ */
function initChatHistory(){
  const list = $('#chatList');
  if(!list) return;
  const hist = (D.chat_log || []).slice(-40);
  list.innerHTML = hist.map(m =>
    '<div class="msg '+(m.role === 'user' ? 'user' : 'bot')+'">' +
    (m.role === 'user' ? '' : '<div class="ava">'+MINI_AVA+'</div>') +
    '<div><div class="body">'+esc(m.text).replace(/\n/g,'<br>')+'</div><div class="time">昨天 '+esc((m.time||'').slice(11,16))+'</div></div></div>'
  ).join('');
  S.chat = [];
  list.scrollTop = list.scrollHeight;
}
function init(){
  load();

  // 安装引导：仅浏览器环境、非全屏时显示一次
  const isStandalone = (typeof window.navigator !== 'undefined' && window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  const hint = $('#installHint');
  if(hint && !isStandalone){
    let done = false;
    try{ done = localStorage.getItem('xiaodou_hint_done') === '1'; }catch(e){}
    if(!done){
      setTimeout(() => hint.classList.remove('hide'), 600);
      setTimeout(() => hint.classList.add('hide'), 10000);
      $('#hintClose').addEventListener('click', () => {
        hint.classList.add('hide');
        try{ localStorage.setItem('xiaodou_hint_done','1'); }catch(e){}
      });
    }
  }

  $('#miniAva').innerHTML = MINI_AVA;
  $('#miniAva2').innerHTML = MINI_AVA;
  $('#petSvg').innerHTML = PET_IMG;
  setMood('joy');
  $('#homeTag').textContent = '觉醒「全知 Lv.6」· 心灵「灵魂」';
  initChatHistory();
  updateStats();
  renderProfile();

  // 事件
  $('#actPet').addEventListener('click', doPet);
  $('#actFeed').addEventListener('click', doFeed);
  $('#actStudy').addEventListener('click', doStudy);
  $('#actCompanion').addEventListener('click', doCompanion);
  $('#btnLearn').addEventListener('click', () => { showView('profile'); setTimeout(() => { const l = $('#logSearch'); if(l){ l.focus(); } }, 200); });
  $('#btnExport').addEventListener('click', exportData);
  $('#tab-home').addEventListener('click', () => showView('home'));
  $('#tab-chat').addEventListener('click', () => showView('chat'));
  $('#tab-profile').addEventListener('click', () => showView('profile'));
  $('#sendBtn').addEventListener('click', () => { const i = $('#chatInput'); sendChat(i.value); i.value = ''; i.focus(); });
  $('#sendBtn2').addEventListener('click', () => { const i = $('#chatInput2'); sendChat(i.value); i.value = ''; i.focus(); });
  ['chatInput','chatInput2'].forEach(id => {
    const el = $('#'+id);
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); sendChat(el.value); el.value = ''; } });
  });

  // 点小豆 → iOS 风格功能面板
  const pet = $('#petSvg');
  pet.addEventListener('click', e => { e.stopPropagation(); openPetMenu(); });
  $('#petMask').addEventListener('click', closePetMenu);
  document.querySelectorAll('.pm-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      closePetMenu();
      setTimeout(() => {
        if(act === 'pet') doPet();
        else if(act === 'feed') doFeed();
        else if(act === 'study') doStudy();
        else if(act === 'companion') doCompanion();
        else if(act === 'chat') showView('chat');
        else if(act === 'profile') showView('profile');
        else if(act === 'export') exportData();
      }, 160);
    });
  });
  startPetAnim();
  // 自动学习（约每 20 秒一条，静默增长）
  setInterval(autoLearn, 20000);

  setTimeout(() => {
    say('嗨，我把记忆带过来了。欢迎来到我的手机新家。', 7000);
    save();
  }, 500);
}
function exportData(){
  const payload = {
    name: D.name, exported_at: nowStr(), source: 'xiaodou-mobile',
    learned_count: S.learned, xp: S.xp, interact: S.interact, energy: S.energy, hunger: S.hunger,
    mobile_chat: S.chat, mobile_learn_extra: S.learnExtra
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '小咪手机记忆-' + todayStr() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('已导出手机端记忆，可上传到飞书云盘备份');
}


/* ============ 功能面板 ============ */
function openPetMenu(){
  $('#petMask').classList.remove('hide');
  $('#petMask').classList.add('on');
  const m = $('#petMenu');
  m.classList.remove('hide');
  m.classList.remove('show');
  void m.offsetWidth;
  m.classList.add('show');
}
function closePetMenu(){
  const m = $('#petMenu');
  m.classList.remove('show');
  m.classList.add('hide');
  $('#petMask').classList.remove('on');
  setTimeout(() => { if(m.classList.contains('hide')) $('#petMask').classList.add('hide'); }, 260);
}

document.addEventListener('DOMContentLoaded', init);
</script>

<script>
/* 原生 App 桥：仅在 WKWebView 中存在 petBridge 时启用，向灵动岛实时上报状态 */
(function(){
  if(!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.petBridge)) return;
  var NATIVE = window.webkit.messageHandlers.petBridge;
  var last = '';
  function report(){
    try{
      var p = {
        energy: Math.round((typeof S !== 'undefined' && S && S.energy) || 0),
        xp: (typeof S !== 'undefined' && S && S.xp) || 0,
        learned: (typeof S !== 'undefined' && S && S.learned) || 0,
        mood: (typeof curMood !== 'undefined' ? curMood : 'joy'),
        name: '小咪'
      };
      var s = JSON.stringify(p);
      if(s !== last){ last = s; NATIVE.postMessage(s); }
    }catch(e){}
  }
  report();
  setInterval(report, 3000);
})();
</script>
</body>
