name: 小咪
options:
  bundleIdPrefix: com.yourname.xiaomi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  小咪:
    type: application
    platform: iOS
    sources:
      - path: 小咪App
    info:
      path: 小咪App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.xiaomi.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies:
      - target: 小咪LiveActivity
        embed: true

schemes:
  小咪:
    build:
      targets:
        小咪: all
        小咪LiveActivity: [archive]
    archive:
      config: Release

  小咪LiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: 小咪LiveActivity
      - path: 小咪App/Shared
    info:
      path: 小咪LiveActivity/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.xiaomi.liveactivity
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
